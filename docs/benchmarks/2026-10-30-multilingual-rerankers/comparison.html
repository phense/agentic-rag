<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lokale Reranker im Vergleich</title><style>
:root{font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground,#20252b)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}label{font-weight:600}select{font:inherit;padding:7px;color:var(--foreground,#20252b);background:var(--card,#f4f6f8);border:1px solid var(--border,#b6bec7);border-radius:var(--radius,7px);max-width:100%}.chart{height:260px;display:flex;flex-direction:column;justify-content:space-around}.row{display:grid;grid-template-columns:minmax(105px,1.3fr) minmax(60px,3fr) 94px;gap:10px;align-items:center;font-size:14px}.track{height:28px;background:var(--secondary,#e5e9ef);border-radius:4px;overflow:hidden}.fill{height:100%;border-radius:4px;transition:width .2s}.value{text-align:right;font-variant-numeric:tabular-nums}.caption,.limits{color:var(--muted-foreground,#616b76);font-size:13px;line-height:1.5}.status{font-size:13px;color:var(--warning-foreground,#92670e);background:var(--warning-surface,#fff5d5);padding:12px;border-radius:var(--radius,7px);margin-top:14px}.caption{min-height:42px}.limits{margin-top:12px} @media(max-width:420px){.row{font-size:12px;grid-template-columns:105px minmax(50px,1fr) 83px;gap:7px}}
</style></head><body><div class="controls"><label for="metric">Vergleich</label><select id="metric"><option value="de">Deutsch: korrekte erste Quelle</option><option value="en">Englisch: korrekte erste Quelle</option><option value="accepted">Vom tatsächlichen Client angenommen</option><option value="primary">Kurze Qualitätsanfragen: Medianzeit</option><option value="focused">6 × 600 Zeichen: p95-Laufzeit</option><option value="rss">Spitzenbedarf des Modellprozesses</option></select></div><div class="chart" id="chart" role="img" aria-label="Vier lokale Reranker im Vergleich"></div><div class="caption" id="caption"></div><div class="status">Jina v3.5: 96/96 Client-Timeouts; erster Langtextaufruf nach 30 s HTTP-Frist + weiteren 120 s noch aktiv. 350 weitere Tests nicht ausgeführt.</div><p class="limits">4 CPU · 8 GiB · CPU ohne GPU · öffentliche synthetische Quellen.<br>Jina v3.5: FP32/Transformers; übrige Modelle: INT8/ONNX. Kein Produktions-Rollout.</p><script>
const data=[{"name": "MiniLM L6 EN/DE", "de": 79.16666666666666, "en": 79.16666666666666, "accepted": 100.0, "primary": 152.2840530014946, "focused": 508.72245999926236, "rss": 835.171875}, {"name": "mMARCO", "de": 85.41666666666666, "en": 85.41666666666666, "accepted": 100.0, "primary": 282.5485945031687, "focused": 1093.819850796717, "rss": 697.87890625}, {"name": "Jina v2", "de": 95.83333333333334, "en": 85.41666666666666, "accepted": 92.70833333333334, "primary": 998.9156070005265, "focused": 3843.1775705976174, "rss": 1170.77734375}, {"name": "Jina v3.5", "de": 91.66666666666666, "en": 91.66666666666666, "accepted": 0.0, "primary": 11729.674536501989, "focused": null, "rss": 3756.91796875}];const descriptions={de:'n=48 deutsche Fragen, jeweils sechs feste Kandidaten. Lineare Skala 0–100 %.',en:'n=48 englische Fragen, jeweils sechs feste Kandidaten. Lineare Skala 0–100 %.',accepted:'n=96 tatsächliche Client-Aufrufe; feste Frist 1,5 s. Lineare Skala 0–100 %.',primary:'n=96 primäre Qualitätsanfragen mit kurzen Originalpassagen. Logarithmische Zeitachse; keine Gleichsetzung mit dem 600-Zeichen-Lasttest.',focused:'Je n=45 erfolgreiche Lastanfragen über drei Prozessstarts. Logarithmische Zeitachse. Jina v3.5: nicht ausgeführt, kein Nullwert.',rss:'Höchster Server-RSS in MiB. Lineare Skala; Speicher der gesamten Prozessgruppe ist separat im Bericht dokumentiert.'};
function draw(){const key=document.getElementById('metric').value;const time=['primary','focused'].includes(key);const percentage=['de','en','accepted'].includes(key);const max=percentage?100:Math.max(...data.map(d=>d[key]||0));document.getElementById('chart').replaceChildren();data.forEach((d,i)=>{const value=d[key];const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=d.name;const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='fill';bar.style.background='var(--chart-'+(i+1)+', '+['#3877bc','#239879','#b47c26','#9970c6'][i]+')';bar.style.width=value===null?'0%':(time?Math.log10(value+1)/Math.log10(max+1)*100:value/max*100)+'%';track.append(bar);const number=document.createElement('span');number.className='value';number.textContent=value===null?'nicht ausgeführt':percentage?value.toLocaleString('de-DE',{maximumFractionDigits:1})+' %':time?(value/1000).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' s':value.toLocaleString('de-DE',{maximumFractionDigits:0})+' MiB';row.append(label,track,number);document.getElementById('chart').append(row)});document.getElementById('caption').textContent=descriptions[key]}
document.getElementById('metric').addEventListener('change',draw);draw();
</script></body></html>
