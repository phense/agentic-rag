name: Offline benchmark contracts
on:
  push:
  pull_request:
jobs:
  benchmark-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest
      - name: Metrics, corpus and failure contracts without services or credentials
        run: python -m pytest -q tests/benchmark/test_metrics.py tests/benchmark/test_failures.py
