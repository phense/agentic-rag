[project]
name = "agentic-rag"
version = "0.6.13"
description = "Lean PostgreSQL-based agentic-RAG memory and session continuity"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
authors = [{ name = "Peter Hense", email = "peter.hense@gmail.com" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "mcp>=1.30.0,<2",
    "pyyaml>=6",
    "tomlkit>=0.13",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.50,<1",
    "pydantic>=2.13,<3",
]

[project.scripts]
rag = "agentic_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
browser = ["pytest>=8", "playwright>=1.55,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_rag"]

[tool.hatch.build.targets.wheel.force-include]
"assets/codex/compact_prompt.md" = "assets/codex/compact_prompt.md"
"assets/claude/compact_prompt.md" = "assets/claude/compact_prompt.md"
"assets/agy/compact_prompt.md" = "assets/agy/compact_prompt.md"
"sql" = "sql"

[tool.hatch.build.targets.sdist.force-include]
"assets/codex/compact_prompt.md" = "assets/codex/compact_prompt.md"
"assets/claude/compact_prompt.md" = "assets/claude/compact_prompt.md"
"assets/agy/compact_prompt.md" = "assets/agy/compact_prompt.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
