[project]
name = "agentic-rag"
version = "0.2.0"
description = "Lean PostgreSQL-based agentic-RAG memory for Claude Code"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
authors = [{ name = "Peter Hense", email = "peter.hense@gmail.com" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "mcp>=1.2",
    "pyyaml>=6",
]

[project.scripts]
rag = "agentic_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
